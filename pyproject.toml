[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-risk-core"
version = "0.1.0"
description = "Market, credit and portfolio risk engines: GARCH volatility, VaR/ES, EVT, Basel backtesting, counterparty exposure and CVA."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "thompgt" }]
keywords = ["risk", "var", "expected-shortfall", "garch", "cva", "basel", "evt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "arch>=6.3,<8",
    "statsmodels>=0.14,<0.16",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40,<0.3", "websocket-client>=1.7,<2"]
viz = ["matplotlib>=3.8,<4", "plotly>=5.20,<7", "kaleido>=0.2.1,<2"]
notebook = ["ipykernel>=6.29,<7", "nbformat>=5.10,<6", "nbconvert>=7.16,<8", "ipywidgets>=8.1,<9"]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
quant-risk-validate = "quant_risk_core.cli:main"

[project.urls]
Homepage = "https://github.com/thompgt/quant-risk-core"
Repository = "https://github.com/thompgt/quant-risk-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # Network tests hit Yahoo Finance, so they are nondeterministic and are
    # excluded in CI with -m "not network". A CI run that silently depends on a
    # third-party API is a CI run that lies about the state of the code.
    "network: requires live market data from an external provider",
    "slow: takes more than a few seconds (model fits over long series)",
]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "SIM108", # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately shadow builtins and use long, explanatory assertions.
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src/quant_risk_core"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# arch, statsmodels and yfinance ship no usable type information.
[[tool.mypy.overrides]]
module = ["arch.*", "statsmodels.*", "yfinance.*", "websocket.*", "scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["quant_risk_core"]
branch = true
